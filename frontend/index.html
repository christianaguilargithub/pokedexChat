<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phase 1 Chatbot</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --dex-red: #d62828;
    --dex-red-dark: #8b1d1d;
    --dex-blue: #204a87;
    --dex-blue-dark: #1a2a4d;
    --dex-screen: #dff7e8;
    --dex-screen-border: #7aa985;
    --dex-panel: #f0f4f8;
    --dex-text: #1c2331;
    --dex-user: #d7ebff;
    --dex-ai: #eef5eb;
    --dex-shadow: rgba(20, 34, 60, 0.25);
  }

  * { box-sizing: border-box; }

  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  body {
    margin: 0;
    min-height: 100vh;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #f1f5fb 0%, #b7c7dc 35%, #6f7f99 100%);
    font-family: 'Press Start 2P', system-ui, sans-serif;
    color: var(--dex-text);
    overflow: hidden;
  }

  .pokedex-shell {
    width: min(90vw, 760px);
    max-height: calc(100vh - 32px);
    background: linear-gradient(135deg, #e63a3a 0%, #c91d1d 22%, #f2f5fa 22%, #edf2f7 100%);
    border: 6px solid #2a2d32;
    border-radius: 24px;
    box-shadow: 0 18px 35px var(--dex-shadow);
    padding: 18px 18px 24px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .pokedex-shell::before {
    content: "";
    position: absolute;
    inset: 10px 12px auto 12px;
    height: 18px;
    border-radius: 12px;
    background: rgba(255,255,255,0.12);
  }

  .pokedex-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 6px 10px 16px;
    border-bottom: 3px solid rgba(42, 45, 50, 0.65);
    margin-bottom: 18px;
  }

  .lights {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .light {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 3px solid rgba(0,0,0,0.35);
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.5);
  }

  .light.red { background: #ff4d4d; }
  .light.yellow { background: #ffd166; }
  .light.green { background: #5ecf7b; }

  .pokedex-top h2 {
    margin: 0;
    font-size: clamp(0.9rem, 1.4vw, 1.2rem);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #1e2a3a;
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  }

  .screen-panel {
    background: linear-gradient(180deg, #cfd8de 0%, #b7c3cf 100%);
    border: 4px solid #2a2d32;
    border-radius: 18px;
    padding: 14px;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.5);
    flex: 1;
    min-height: 0;
  }

  .dex-layout {
    display: grid;
    grid-template-columns: minmax(180px, 0.85fr) minmax(0, 1.8fr);
    gap: 16px;
    align-items: stretch;
  }

  .sprite-panel,
  .stats-panel {
    background: rgba(32, 58, 92, 0.08);
    border: 3px solid rgba(42,45,50,0.5);
    border-radius: 14px;
    padding: 14px;
  }

  .sprite-panel.hidden,
  .stats-panel.hidden {
    display: none;
  }

  .sprite-area {
    min-height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, rgba(255,255,255,0.2), rgba(34,80,124,0.08));
    border: 3px solid rgba(42,45,50,0.4);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    padding: 12px;
  }

  .sprite-area::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0.18),
      rgba(255,255,255,0.02) 50%,
      rgba(0,0,0,0.06)
    );
  }

  .sprite-area::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.12),
      rgba(255,255,255,0.12) 2px,
      rgba(0,0,0,0.02) 2px,
      rgba(0,0,0,0.02) 4px
    );
    pointer-events: none;
  }

  .sprite {
    position: relative;
    z-index: 1;
    width: 150px;
    height: 150px;
    object-fit: contain;
    filter: drop-shadow(0 10px 12px rgba(36,46,67,0.26));
    animation: floatSprite 2.5s ease-in-out infinite;
  }

  @keyframes floatSprite {
    0%, 100% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-10px) scale(1.03); }
  }

  .stats-panel h3 {
    margin-top: 0;
    margin-bottom: 12px;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px 10px;
    font-size: 0.7rem;
  }

  .stat-grid span:nth-child(odd) {
    color: #304d67;
  }

  .stat-grid span:nth-child(even) {
    font-weight: 700;
    text-align: right;
  }

  #chat-window {
    background: linear-gradient(180deg, #dff7e8 0%, #d4efe0 100%);
    border: 4px solid var(--dex-screen-border);
    border-radius: 14px;
    height: clamp(260px, 38vh, 340px);
    overflow-y: auto;
    padding: 18px;
    box-shadow: inset 0 0 18px rgba(42, 96, 72, 0.18);
    position: relative;
  }

  #chat-window::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0.06),
      rgba(255,255,255,0.06) 50%,
      rgba(0,0,0,0.02)
    );
    pointer-events: none;
  }

  .msg {
    margin: 10px 0;
    padding: 10px 12px;
    border-radius: 12px;
    max-width: 82%;
    line-height: 1.45;
    word-wrap: break-word;
    box-shadow: 0 2px 8px rgba(43, 52, 65, 0.12);
    overflow-wrap: anywhere;
  }

  .msg.user {
    background: linear-gradient(135deg, var(--dex-user), #b6d7f5);
    margin-left: auto;
    text-align: right;
    border: 1px solid rgba(63, 119, 182, 0.4);
  }

  .msg.ai {
    background: linear-gradient(135deg, var(--dex-ai), #dfead9);
    border: 1px solid rgba(85, 128, 90, 0.4);
  }

  .msg.ai h1, .msg.ai h2, .msg.ai h3,
  .msg.ai p, .msg.ai ul, .msg.ai table {
    margin-top: 0;
    margin-bottom: 10px;
  }

  .msg.ai h1, .msg.ai h2, .msg.ai h3 {
    color: #1a2f52;
  }

  .msg.ai ul {
    padding-left: 20px;
    margin-bottom: 12px;
  }

  .msg.ai table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 12px;
    font-size: 0.95rem;
  }

  .msg.ai th,
  .msg.ai td {
    border: 1px solid rgba(29, 60, 94, 0.35);
    padding: 6px 8px;
    text-align: left;
    vertical-align: top;
  }

  .msg.ai th {
    background: rgba(69, 109, 158, 0.12);
  }

  .pokemon-image {
    display: block;
    width: 180px;
    height: 180px;
    object-fit: contain;
    margin-top: 8px;
    border-radius: 12px;
    background: rgba(255,255,255,0.25);
    padding: 8px;
  }

  .input-row {
    display: flex;
    gap: 12px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 3px solid rgba(42,45,50,0.65);
  }

  #message-input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: 3px solid #2a2d32;
    background: #f4f8fb;
    color: var(--dex-text);
    font-size: 1rem;
    outline: none;
  }

  #message-input:focus {
    box-shadow: 0 0 0 3px rgba(32,74,135,0.18);
  }

  button {
    padding: 12px 18px;
    border: 3px solid #2a2d32;
    border-radius: 12px;
    background: linear-gradient(180deg, #4e8fe8 0%, #2e5ea8 100%);
    color: white;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(21, 55, 107, 0.8);
    transition: transform 0.1s ease;
  }

  button:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(21, 55, 107, 0.8);
  }

  @media (max-width: 640px) {
    .pokedex-shell {
      padding: 14px 14px 18px;
    }

    .pokedex-top {
      flex-direction: column;
      align-items: flex-start;
    }

    .input-row {
      flex-direction: column;
    }

    button {
      width: 100%;
    }

    #chat-window {
      height: 360px;
    }
  }
</style>
</head>
<body>
  <div class="pokedex-shell">
    <div class="pokedex-top">
      <div class="lights">
        <span class="light red"></span>
        <span class="light yellow"></span>
        <span class="light green"></span>
      </div>
      <h2>Pokédex Chat</h2>
    </div>

    <div class="screen-panel">
      <div class="dex-layout">
        <div class="sprite-panel hidden">
          <div class="sprite-area">
            <img id="pokemon-sprite" class="sprite" src="" alt="" />
          </div>
        </div>

        <div class="stats-panel hidden">
          <h3>Pokédex Stats</h3>
          <div id="pokemon-stats" class="stat-grid"></div>
        </div>
      </div>

      <div id="chat-window" class="screen"></div>
    </div>

    <div id="input-row" class="input-row">
      <input id="message-input" type="text" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

<script>
const BACKEND_URL = "http://127.0.0.1:8000";

function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatInlineMarkdown(text) {
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>")
    .replace(/_(.+?)_/g, "<em>$1</em>")
    .replace(/`(.+?)`/g, "<code>$1</code>");
}

function markdownToHtml(text) {
  const lines = (text || "").replace(/\r/g, "").split("\n");
  let html = "";
  let tableRows = [];
  let listItems = [];

  const flushList = () => {
    if (!listItems.length) return;
    html += "<ul>" + listItems.map(item => `<li>${item}</li>`).join("") + "</ul>";
    listItems = [];
  };

  const flushTable = () => {
    if (tableRows.length < 2) {
      tableRows = [];
      return;
    }

    const [header, ...body] = tableRows;
    const th = header.map(cell => `<th>${cell}</th>`).join("");
    const tr = body
      .map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join("")}</tr>`)
      .join("");

    html += `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
    tableRows = [];
  };

  for (const rawLine of lines) {
    const line = rawLine.trimEnd();

    if (!line.trim()) {
      flushList();
      flushTable();
      html += "<br>";
      continue;
    }

    if (line.startsWith("|")) {
      flushList();
      const cells = line
        .split("|")
        .slice(1, -1)
        .map(cell => formatInlineMarkdown(cell.trim()));

      if (cells.every(cell => /^\s*[:\-]+\s*$/.test(cell.replace(/<[^>]+>/g, "")))) {
        continue;
      }

      tableRows.push(cells);
      continue;
    }

    if (line.startsWith("- ") || line.startsWith("* ")) {
      flushTable();
      listItems.push(formatInlineMarkdown(line.replace(/^[-*]\s+/, "")));
      continue;
    }

    flushTable();
    flushList();

    if (line.startsWith("### ")) {
      html += `<h3>${formatInlineMarkdown(line.slice(4))}</h3>`;
    } else if (line.startsWith("## ")) {
      html += `<h2>${formatInlineMarkdown(line.slice(3))}</h2>`;
    } else if (line.startsWith("# ")) {
      html += `<h1>${formatInlineMarkdown(line.slice(2))}</h1>`;
    } else if (line.startsWith("|")) {
      // no-op
    } else {
      html += `<p>${formatInlineMarkdown(line)}</p>`;
    }
  }

  flushList();
  flushTable();

  return html;
}

function setPokemonPanelsVisible(visible) {
  document.querySelector(".sprite-panel")?.classList.toggle("hidden", !visible);
  document.querySelector(".stats-panel")?.classList.toggle("hidden", !visible);
}

function updatePokemonDisplay(pokemon) {
  if (!pokemon) {
    setPokemonPanelsVisible(false);
    return;
  }

  const sprite = document.getElementById("pokemon-sprite");
  const stats = document.getElementById("pokemon-stats");

  setPokemonPanelsVisible(true);

  if (sprite && (pokemon.image_url || pokemon.sprite_url)) {
    sprite.src = pokemon.image_url || pokemon.sprite_url;
    sprite.alt = `${pokemon.name || "Pokémon"} sprite`;
  }

  if (stats) {
    const rows = [
      ["Type", pokemon.types?.join(", ") || "—"],
      ["Abilities", pokemon.abilities?.join(", ") || "—"],
      ["HP", pokemon.base_stats?.hp ?? "—"],
      ["Attack", pokemon.base_stats?.attack ?? "—"],
      ["Defense", pokemon.base_stats?.defense ?? "—"],
      ["Speed", pokemon.base_stats?.speed ?? "—"],
      ["Height", pokemon.height_m != null ? `${pokemon.height_m} m` : "—"],
      ["Weight", pokemon.weight_kg != null ? `${pokemon.weight_kg} kg` : "—"],
      ["Gen", pokemon.generation || "—"],
      ["Habitat", pokemon.habitat || "—"],
    ];

    stats.innerHTML = rows
      .map(([label, value]) => `<span>${label}</span><span>${value}</span>`)
      .join("");
  }
}

function appendMessage(text, sender, imageUrl = null) {
  const chatWindow = document.getElementById("chat-window");
  const div = document.createElement("div");
  div.className = "msg " + sender;

  if (sender === "ai") {
    div.innerHTML = markdownToHtml(text);
  } else {
    div.textContent = text;
  }

  if (imageUrl) {
    const image = document.createElement("img");
    image.className = "pokemon-image";
    image.src = imageUrl;
    image.alt = "Pokemon artwork";
    image.loading = "lazy";
    div.appendChild(image);
  }
  chatWindow.appendChild(div);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("message-input");
  const message = input.value.trim();
  if (!message) return;

  appendMessage(message, "user");
  input.value = "";

  // This is the entire "AI integration" from the frontend's point of view:
  // POST the message, wait for JSON back, display it.
  const response = await fetch(BACKEND_URL + "/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: message }),
  });

  const data = await response.json();

  if (data.pokemon) {
    updatePokemonDisplay(data.pokemon);
  } else {
    setPokemonPanelsVisible(false);
  }

  appendMessage(data.reply || data.error || "", "ai");
}

document.getElementById("message-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});
</script>
</body>
</html>
