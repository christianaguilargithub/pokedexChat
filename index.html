<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pokédex Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="device">
    <div class="topbar">
      <div class="big-lens"></div>
      <div class="small-lens y"></div>
      <div class="small-lens g"></div>
      <div class="small-lens r"></div>
      <div class="title">POKÉDEX</div>
      <div class="status-pill"><span class="status-dot" id="statusDot"></span><span id="statusText">READY</span></div>
      <button class="config-btn" id="configBtn" title="Set backend URL">API</button>
    </div>

    <div class="screens">
      <div class="screen-frame">
        <div class="screen-glass sprite-screen">
          <div class="scanlines"></div>
          <div class="sprite-frame" id="spriteFrame">
            <svg class="pokeball-idle" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="46" fill="#fff" stroke="#1c2b1f" stroke-width="4"/>
              <path d="M4,50 A46,46 0 0 1 96,50 Z" fill="#E3350D" stroke="#1c2b1f" stroke-width="4"/>
              <rect x="4" y="47" width="92" height="6" fill="#1c2b1f"/>
              <circle cx="50" cy="50" r="14" fill="#fff" stroke="#1c2b1f" stroke-width="4"/>
              <circle cx="50" cy="50" r="6" fill="#fff" stroke="#1c2b1f" stroke-width="3"/>
            </svg>
          </div>
          <div class="sprite-label" id="spriteLabel">NO DATA</div>
          <div class="sprite-sub" id="spriteSub">Ask about a Pokémon to scan it</div>
          <div class="hint-box">
            Try: "tell me about eevee" · "what is charizard" · "who is Ash's first Pokémon"
          </div>
        </div>
      </div>

      <div class="screen-frame">
        <div class="screen-glass chat-screen">
          <div class="scanlines"></div>
          <div class="chat-log" id="chatLog"></div>
        </div>
      </div>
    </div>

    <div class="deck">
      <div class="dpad">
        <div class="dpad-h"></div>
        <div class="dpad-v"></div>
        <div class="dpad-center"></div>
      </div>
      <form class="composer" id="composerForm" autocomplete="off">
        <input type="text" class="msg-input" id="msgInput" placeholder="Type a message..." />
        <button type="submit" class="send-btn" id="sendBtn">GO</button>
      </form>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
